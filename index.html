<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Titipan Kue</title>
    
    <!-- Tailwind CSS untuk Desain -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- ⚠️ PENTING: Library Resmi Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div class="max-w-4xl mx-auto p-4 sm:p-6">
        <!-- Header Aplikasi -->
        <header class="mb-6">
            <h1 class="text-2xl font-bold text-teal-800">Catatan Titipan Kue</h1>
            <p id="connection-status" class="text-sm font-medium text-amber-600 mt-1">
                Memeriksa koneksi Supabase...
            </p>
        </header>

        <!-- Navigasi / Tab Menu -->
        <div class="flex border-b border-teal-600 mb-6">
            <button class="py-2 px-4 font-semibold text-teal-800 border-b-2 border-teal-600 focus:outline-none">
                Input Harian
            </button>
        </div>

        <!-- Area Konten Utama -->
        <main class="bg-white rounded-xl shadow-sm p-4 sm:p-6 border border-slate-100">
            <div id="app-content">
                <p class="text-slate-500">Memuat data...</p>
            </div>
        </main>
    </div>

    <!-- Script Utama Koneksi dan Logika Aplikasi -->
    <script>
        // =========================================================================
        // ⚙️ KONFIGURASI SUPABASE ANDA (Sudah dimasukkan otomatis)
        // =========================================================================
        const SUPABASE_URL = 'https://yblhcwgnpzfvslzydaig.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_T2ll9tSgmzLj-oeiTVxp8A_OUKEaoES';

        let supabaseClient = null;
        const statusEl = document.getElementById('connection-status');

        // Inisialisasi Koneksi Supabase
        try {
            if (window.supabase && SUPABASE_URL.startsWith('https://')) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                // Tes koneksi ringan ke database
                supabaseClient.from('test').select('count', { count: 'exact', head: true })
                    .then(({ error }) => {
                        if (error) {
                            console.warn("Peringatan koneksi:", error.message);
                            statusEl.textContent = "Supabase: offline / menggunakan penyimpanan lokal (Cek Nama Tabel)";
                            statusEl.className = "text-sm font-medium text-amber-600 mt-1";
                        } else {
                            statusEl.textContent = "Supabase: Terhubung & Online ✅";
                            statusEl.className = "text-sm font-medium text-emerald-600 mt-1";
                        }
                    });
            } else {
                throw new Error("Library Supabase belum termuat dengan sempurna.");
            }
        } catch (err) {
            console.error("Gagal menginisialisasi Supabase:", err);
            statusEl.textContent = "Supabase: offline / menggunakan penyimpanan lokal";
            statusEl.className = "text-sm font-medium text-rose-600 mt-1";
        }
    </script>
</body>
</html>
